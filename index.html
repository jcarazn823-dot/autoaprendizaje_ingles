      -webkit-backface-visibility: hidden;

    }

    // Cargar progreso guardado si existe
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          appState = {
            ...appState,
            ...parsed,
            flashcardState: { ...appState.flashcardState, ...(parsed.flashcardState || {}) },
            hideIrregulars: { ...appState.hideIrregulars, ...(parsed.hideIrregulars || {}) },
            tfAnswers: { ...appState.tfAnswers, ...(parsed.tfAnswers || {}) },
            writing: { ...appState.writing, ...(parsed.writing || {}) }
          };
        }
      } catch (e) {
        console.warn('No se pudo cargar el progreso previo:', e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn('No se pudo guardar el progreso:', e);
      }
    }

    /**
     * 3. NOTIFICACIONES SUAVES (TOASTS) Y REINICIO SIN ALERT/CONFIRM
     */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-900 text-white border-emerald-700',
        info: 'bg-slate-900 text-white border-slate-700',
        warn: 'bg-amber-900 text-amber-50 border-amber-700'
      };
      toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-lg text-xs sm:text-sm font-medium transition-all duration-300 ${colors[type] || colors.info}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    let resetConfirmPending = false;
    let resetTimer = null;

    function handleResetClick() {
      const btn = document.getElementById('reset-btn');
      if (!resetConfirmPending) {
        resetConfirmPending = true;
        btn.textContent = '¿Borrar?';
        btn.className = 'px-2.5 py-1.5 text-xs font-bold bg-rose-600 text-white rounded-xl shadow-sm transition-all';
        showToast('Pulsa de nuevo "¿Borrar?" para reiniciar tu progreso.', 'warn');
        resetTimer = setTimeout(() => {
          resetConfirmPending = false;
          btn.textContent = '↺';
          btn.className = 'p-2 text-xs font-medium text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-colors';
        }, 3500);
      } else {
        clearTimeout(resetTimer);
        resetConfirmPending = false;
        btn.textContent = '↺';
        btn.className = 'p-2 text-xs font-medium text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-colors';

        appState.completedSections = {};
        appState.inputs = {};
        appState.irregularInputs = {};
        appState.scrambleSelected = {};
        appState.writing = { mod1: '', mod2: '', mod3: '', mod4: '', mod5: '', mod6: '', mod7: '', mod8: '', mod9: '' };
        appState.tfAnswers = { mod1: {}, mod2: {}, mod3: {}, mod4: {}, mod5: {}, mod6: {}, mod7: {}, mod8: {}, mod9: {} };
        localStorage.removeItem(STORAGE_KEY);
        updateProgressUI();
        renderNavigation();
        renderActiveView();
        showToast('Progreso reiniciado correctamente.', 'info');
      }
    }

    /**
     * 4. BARRA DE PROGRESO GLOBAL Y CASILLAS DE SECCIÓN
     */
    const TOTAL_TRACKABLE_SECTIONS = 45; // 5 secciones x 9 módulos activos (M1 al M9)

    function toggleSectionComplete(sectionId) {
      appState.completedSections[sectionId] = !appState.completedSections[sectionId];
      saveState();
      updateProgressUI();
      renderNavigation();

      const card = document.getElementById(`card-${sectionId}`);
      if (card) {
        if (appState.completedSections[sectionId]) {
          card.classList.add('border-emerald-300', 'bg-emerald-50/20');
          card.classList.remove('border-slate-200');
          showToast('✅ ¡Sección completada y guardada!', 'success');
        } else {
          card.classList.remove('border-emerald-300', 'bg-emerald-50/20');
          card.classList.add('border-slate-200');
        }
      }
    }

    function updateProgressUI() {
      const completedCount = Object.values(appState.completedSections).filter(Boolean).length;
      const percent = Math.min(100, Math.round((completedCount / TOTAL_TRACKABLE_SECTIONS) * 100));
      document.getElementById('progress-count').textContent = `${completedCount}/${TOTAL_TRACKABLE_SECTIONS} secciones`;
      document.getElementById('progress-percent').textContent = `${percent}%`;
      document.getElementById('progress-bar-fill').style.width = `${percent}%`;
    }

    function isModuleComplete(modId) {
      return [1, 2, 3, 4, 5].every(n => appState.completedSections[`${modId}_s${n}`]);
    }

          <div class="absolute inset-0 bg-gradient-to-t from-slate-950/85 via-slate-950/30 to-transparent flex flex-col items-center justify-center p-4 text-center">

    function activateYouTubePlayer(boxId, videoId, title) {
      const container = document.getElementById(boxId);
      if (!container) return;

      // Si se abre como archivo local (file://), los navegadores no envían cabecera Referer y YouTube muestra Error 153
      if (window.location.protocol === 'file:') {
        window.open(`https://www.youtube.com/watch?v=${videoId}`, '_blank', 'noopener,noreferrer');
        showToast('En archivos locales (file://) YouTube bloquea el marco; se ha abierto en una pestaña nueva.', 'warn');
        return;
      }

      container.innerHTML = `
        <iframe
          class="w-full h-full"
          src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0"
          title="${escapeAttr(title)}"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      `;
    }

    function prevFlashcard(modId) {
      const st = appState.flashcardState[modId];
      st.flipped = false;
      st.index = (st.index - 1 + 15) % 15;
      document.getElementById(`flashcards-container-${modId}`).innerHTML = renderFlashcardsSection(modId);
    }

    function nextFlashcard(modId) {
      const st = appState.flashcardState[modId];
      st.flipped = false;
      st.index = (st.index + 1) % 15;
      document.getElementById(`flashcards-container-${modId}`).innerHTML = renderFlashcardsSection(modId);
    }

    function shuffleFlashcards(modId) {
      const st = appState.flashcardState[modId];
      const arr = [...Array(15).keys()];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      st.order = arr;
      st.index = 0;
      st.flipped = false;
      document.getElementById(`flashcards-container-${modId}`).innerHTML = renderFlashcardsSection(modId);
      showToast('🔀 Tarjetas barajadas aleatoriamente.', 'info');
    }

    function checkIrregularTable(modId) {
      const groups = MODULE_DATA[modId].irregularGroups;
      let total = 0;
      let correct = 0;

      groups.forEach((g, gIdx) => {
        g.verbs.forEach((v, vIdx) => {
          const pastKey = `${modId}_irr_${gIdx}_${vIdx}_past`;
          const partKey = `${modId}_irr_${gIdx}_${vIdx}_part`;

          const userPast = normalizeText(appState.irregularInputs[pastKey]);
          const expectedPast = normalizeText(v.past).replace(/\s*\(\/red\/\)/g, '');
          const pastOk = userPast === expectedPast || (v.inf === 'be' && ['was', 'were', 'was/were', 'was / were'].includes(userPast));
          styleInputResult(pastKey, pastOk);
          total++;
          if (pastOk) correct++;

          const userPart = normalizeText(appState.irregularInputs[partKey]);
          const expectedPart = normalizeText(v.part).replace(/\s*\(\/red\/\)/g, '');
          const partOk = userPart === expectedPart;
          styleInputResult(partKey, partOk);
          total++;
          if (partOk) correct++;
        });
      });

      if (correct === total) {
        showToast(`🎉 ¡Impecable! Has acertado las ${total} formas verbales.`, 'success');
      } else {
        showToast(`Has acertado ${correct} de ${total}. Revisa las celdas marcadas en rojo.`, 'warn');
      }
    }

    function toggleScrambleWord(modId, qIdx, wordIdx) {
      const key = `${modId}_ord_${qIdx}`;
      if (!appState.scrambleSelected[key]) appState.scrambleSelected[key] = [];
      const arr = appState.scrambleSelected[key];
      const existingPos = arr.indexOf(wordIdx);
      if (existingPos !== -1) {
        arr.splice(existingPos, 1);
      } else {
        arr.push(wordIdx);
      }
      saveState();
      const container = document.getElementById(`scramble-container-${modId}`);
      if (container) container.innerHTML = renderScrambleItems(modId);
    }

    function resetScrambleWord(modId, qIdx) {
      const key = `${modId}_ord_${qIdx}`;
      appState.scrambleSelected[key] = [];
      saveState();
      const container = document.getElementById(`scramble-container-${modId}`);
      if (container) container.innerHTML = renderScrambleItems(modId);
    }

    function normalizeSentence(str) {
      return (str || '')
        .trim()
        .toLowerCase()
        .replace(/[’‘]/g, "'")
        .replace(/\bdoesn't\b/g, 'does not')
        .replace(/\bdon't\b/g, 'do not')
        .replace(/\bdidn't\b/g, 'did not')
        .replace(/\bwasn't\b/g, 'was not')
        .replace(/\bweren't\b/g, 'were not')
        .replace(/\bhadn't\b/g, 'had not')
        .replace(/\bhaven't\b/g, 'have not')
        .replace(/\bhasn't\b/g, 'has not')
        .replace(/\bcouldn't\b/g, 'could not')
        .replace(/\bshouldn't\b/g, 'should not')
        .replace(/\bmustn't\b/g, 'must not')
        .replace(/\bwouldn't\b/g, 'would not')
        .replace(/\bisn't\b/g, 'is not')
        .replace(/\baren't\b/g, 'are not')
        .replace(/\bwon't\b/g, 'will not')
        .replace(/\bcan't\b/g, 'cannot')
        .replace(/[.?!]+$/g, '')
        .replace(/\s+/g, ' ');
    }

    function checkErrorCorrection(modId) {
      const data = EXTRA_ACTIVITIES[modId];
      if (!data) return;
      let allCorrect = true;

      data.errorCorrection.forEach((item, idx) => {
        const inputKey = `${modId}_err_${idx}`;
        const userVal = normalizeSentence(appState.inputs[inputKey]);
        const expected = normalizeSentence(item.correct);
        const ok = userVal === expected;
        styleInputResult(inputKey, ok);
        const fb = document.getElementById(`fb_${inputKey}`);
        if (fb) {
          fb.innerHTML = ok
            ? '<span class="text-emerald-700">✅ ¡Corregida!</span>'
            : `<span class="text-rose-700">❌ Pista: ${item.hint}</span>`;
        }
        if (!ok) allCorrect = false;
      });

      if (allCorrect) {
        showToast('🎉 ¡Excelente! Has detectado y corregido todos los errores.', 'success');
      } else {
        showToast('Revisa las pistas en rojo e inténtalo de nuevo.', 'warn');
      }
    }

        const selectedIndices = appState.scrambleSelected[key] || [];
        const built = normalizeSentence(selectedIndices.map(i => item.words[i]).join(' '));
        const expected = normalizeSentence(item.target);
        const ok = built === expected;
        const box = document.getElementById(`box_${key}`);
        if (box) {
          box.classList.remove('border-slate-300', 'border-emerald-500', 'bg-emerald-50/40', 'border-rose-400', 'bg-rose-50/40');
          if (ok) {
            box.classList.add('border-emerald-500', 'bg-emerald-50/40');
          } else {
            box.classList.add('border-rose-400', 'bg-rose-50/40');
          }
        }
        const fb = document.getElementById(`fb_${key}`);
        if (fb) {
          fb.innerHTML = ok
            ? '<span class="text-emerald-700">✅ ¡Orden perfecto!</span>'
            : `<span class="text-rose-700">❌ Pista: ${item.hint}</span>`;
        }
        if (!ok) allCorrect = false;
      });

      if (allCorrect) {
        showToast('🎉 ¡Genial! Todas las frases están bien ordenadas.', 'success');
      } else {
        showToast('Alguna palabra no está en su sitio; revisa el orden.', 'warn');

    /**
     * 17. UTILIDADES DE TEXTO Y CONTADOR DE PALABRAS
     */
    function countWords(str) {
      const cleaned = (str || '').trim();
      if (!cleaned) return 0;
      return cleaned.split(/\s+/).length;
    }

    function updateWriting(modId, val) {
      appState.writing[modId] = val;
      saveState();
      const counter = document.getElementById(`wc_${modId}`);
      if (counter) counter.textContent = `${countWords(val)} palabras`;
    }

    function escapeHtml(str) {
      return (str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function escapeAttr(str) {
      return (str || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    /**
     * 18. RENDERIZADOR PRINCIPAL E INICIALIZACIÓN
